<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loop wrapped into a harness, run many times as a factory" style="width:100%;height:auto;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="sfa-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6E6A5E"/></marker>
    <marker id="sfa-arrowd" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#B9B2A0"/></marker>
  </defs>
  <rect x="8" y="8" width="1144" height="364" rx="20" fill="#FAF8F1" stroke="#E7E1D3" stroke-width="2"/>
  <!-- Col 1: the loop -->
  <text x="190" y="52" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#C8891A">THE LOOP</text>
  <circle cx="190" cy="215" r="94" fill="#FFFFFF" stroke="#DAD3C2" stroke-width="2"/>
  <path d="M 250,150 A 94,94 0 0 1 268,205" fill="none" stroke="#C8891A" stroke-width="3" marker-end="url(#sfa-arrow)"/>
  <g font-size="14" fill="#23221E">
    <rect x="143" y="112" width="94" height="30" rx="15" fill="#FCF3DC" stroke="#E4CE97"/><text x="190" y="132" text-anchor="middle">context</text>
    <rect x="86" y="255" width="70" height="30" rx="15" fill="#FCF3DC" stroke="#E4CE97"/><text x="121" y="275" text-anchor="middle">act</text>
    <rect x="224" y="255" width="80" height="30" rx="15" fill="#FCF3DC" stroke="#E4CE97"/><text x="264" y="275" text-anchor="middle">verify</text>
  </g>
  <text x="190" y="205" text-anchor="middle" font-size="16" font-weight="700" fill="#23221E">one</text>
  <text x="190" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#23221E">agent</text>
  <text x="190" y="345" text-anchor="middle" font-size="13.5" fill="#6E6A5E">gather → act → verify → repeat</text>
  <!-- connector -->
  <line x1="300" y1="215" x2="392" y2="215" stroke="#6E6A5E" stroke-width="2" marker-end="url(#sfa-arrow)"/>
  <text x="346" y="203" text-anchor="middle" font-size="12.5" font-style="italic" fill="#6E6A5E">wrap it</text>
  <!-- Col 2: the harness -->
  <text x="530" y="52" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#C8891A">THE HARNESS</text>
  <rect x="410" y="90" width="240" height="230" rx="16" fill="#FFFFFF" stroke="#DAD3C2" stroke-width="2"/>
  <text x="430" y="118" font-size="12.5" font-weight="700" letter-spacing="1" fill="#8A8574">HARNESS</text>
  <circle cx="470" cy="190" r="30" fill="#FFFFFF" stroke="#DAD3C2" stroke-width="2"/>
  <path d="M 490,168 A 30,30 0 0 1 495,193" fill="none" stroke="#C8891A" stroke-width="2.5" marker-end="url(#sfa-arrow)"/>
  <text x="470" y="195" text-anchor="middle" font-size="12" fill="#6E6A5E">loop</text>
  <g font-size="13" fill="#23221E">
    <rect x="520" y="140" width="112" height="30" rx="8" fill="#F3EFE4" stroke="#DAD3C2"/><text x="576" y="160" text-anchor="middle">sandbox</text>
    <rect x="520" y="176" width="112" height="30" rx="8" fill="#F3EFE4" stroke="#DAD3C2"/><text x="576" y="196" text-anchor="middle">tools</text>
    <rect x="520" y="212" width="112" height="30" rx="8" fill="#F3EFE4" stroke="#DAD3C2"/><text x="576" y="232" text-anchor="middle">memory</text>
    <rect x="410" y="262" width="240" height="0" fill="none"/>
    <rect x="440" y="262" width="180" height="30" rx="8" fill="#FCE9BE" stroke="#C8891A"/><text x="530" y="282" text-anchor="middle">gates: what "done" means</text>
  </g>
  <text x="530" y="345" text-anchor="middle" font-size="13.5" fill="#6E6A5E">a loop, given walls</text>
  <!-- connector -->
  <line x1="658" y1="215" x2="712" y2="215" stroke="#6E6A5E" stroke-width="2" marker-end="url(#sfa-arrow)"/>
  <text x="685" y="203" text-anchor="middle" font-size="12.5" font-style="italic" fill="#6E6A5E">run many</text>
  <!-- Col 3: the factory -->
  <text x="930" y="52" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#C8891A">THE FACTORY</text>
  <rect x="720" y="78" width="424" height="248" rx="18" fill="#FBF7EC" stroke="#DAD3C2" stroke-width="2"/>
  <g font-size="12.5" fill="#23221E">
    <rect x="742" y="112" width="116" height="40" rx="9" fill="#FFFFFF" stroke="#DAD3C2"/><text x="800" y="137" text-anchor="middle">harness</text>
    <rect x="742" y="164" width="116" height="40" rx="9" fill="#FFFFFF" stroke="#DAD3C2"/><text x="800" y="189" text-anchor="middle">harness</text>
    <rect x="742" y="216" width="116" height="40" rx="9" fill="#FFFFFF" stroke="#DAD3C2"/><text x="800" y="241" text-anchor="middle">harness</text>
  </g>
  <line x1="858" y1="132" x2="912" y2="176" stroke="#B9B2A0" stroke-width="2" marker-end="url(#sfa-arrowd)"/>
  <line x1="858" y1="184" x2="912" y2="188" stroke="#B9B2A0" stroke-width="2" marker-end="url(#sfa-arrowd)"/>
  <line x1="858" y1="236" x2="912" y2="200" stroke="#B9B2A0" stroke-width="2" marker-end="url(#sfa-arrowd)"/>
  <rect x="915" y="150" width="104" height="76" rx="12" fill="#FCE9BE" stroke="#C8891A" stroke-width="2"/>
  <text x="967" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#23221E">review</text>
  <text x="967" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#23221E">/ merge</text>
  <line x1="1019" y1="188" x2="1052" y2="188" stroke="#6E6A5E" stroke-width="2" marker-end="url(#sfa-arrow)"/>
  <rect x="1054" y="162" width="76" height="52" rx="10" fill="#D7EEDF" stroke="#2E7D57"/><text x="1092" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#1F5B3E">prod</text>
  <!-- you -->
  <circle cx="967" cy="104" r="11" fill="#23221E"/><path d="M952,124 a15,13 0 0 1 30,0" fill="#23221E"/>
  <text x="1010" y="112" font-size="12.5" font-weight="700" fill="#23221E">you</text>
  <text x="1010" y="128" font-size="11.5" fill="#6E6A5E">the outer loop</text>
  <text x="932" y="352" text-anchor="middle" font-size="13.5" fill="#6E6A5E">many loops, at scale, drained through one gate</text>
</svg>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niveles de sueño</title>
<style>
  :root {
    --fondo: #0b1026;         /* azul noche profundo */
    --panel: #141b3d;
    --texto: #e8ecff;
    --apagado: #8b93b8;
    --dorado: #f0b429;        /* el color del tótem */
    --verde: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 40px;
    background: radial-gradient(1200px 700px at 50% -10%, #1a2452 0%, var(--fondo) 60%);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
  }
  .nivel {
    font-size: clamp(64px, 14vw, 150px); font-weight: 800; line-height: 1;
    color: var(--dorado);
    text-shadow: 0 0 40px rgba(240, 180, 41, .35);
  }
  .nombre { font-size: clamp(26px, 4vw, 40px); font-weight: 700; margin-top: 6px; }
  .descripcion { color: var(--apagado); font-size: 19px; max-width: 560px; margin: 10px auto 0; }
  .camino {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px;
  }
  .nodo {
    padding: 8px 14px; border-radius: 10px; background: var(--panel);
    border: 1px solid #263058; color: var(--apagado);
  }
  .nodo.activo { border-color: var(--dorado); color: var(--texto); box-shadow: 0 0 14px rgba(240,180,41,.25); }
  .flecha { color: #3a4478; font-size: 18px; }
  .fuente { font-size: 15px; color: var(--apagado); }
  .fuente strong { color: var(--verde); font-family: ui-monospace, Menlo, monospace; }
  .fila { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .contador { color: var(--apagado); font-size: 15px; }
  .contador b { color: var(--texto); font-size: 18px; }
  button {
    font: inherit; font-weight: 700; font-size: 19px;
    padding: 14px 30px; border-radius: 999px; cursor: pointer;
    color: #1c1602; background: var(--dorado); border: 0;
    box-shadow: 0 6px 24px rgba(240, 180, 41, .35);
    transition: transform .1s ease;
  }
  button:hover { transform: translateY(-2px); }
  button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
  <div>
    <div class="nivel" id="nivel">…</div>
    <div class="nombre" id="nombre"></div>
    <p class="descripcion" id="descripcion"></p>
  </div>

  <div class="camino" id="camino">
    <span class="nodo activo" id="n-web">web</span><span class="flecha">→</span>
    <span class="nodo activo" id="n-api">api</span><span class="flecha">→</span>
    <span class="nodo" id="n-cache">cache</span><span class="flecha">o</span>
    <span class="nodo" id="n-db">db</span>
  </div>

  <div class="fila">
    <button id="btn">Ir más profundo ↓</button>
    <span class="contador">descensos: <b id="descensos">0</b></span>
  </div>

  <p class="fuente">respuesta servida por <strong id="fuente">…</strong></p>

<script>
  const $ = (id) => document.getElementById(id);
  const ES_LIMBO = 4;

  function pintar(d) {
    $("nivel").textContent = "NIVEL " + d.nivel + (d.nivel === ES_LIMBO ? " · LIMBO" : "");
    $("nombre").textContent = d.nombre;
    $("descripcion").textContent = d.descripcion;
    $("descensos").textContent = d.descensos;
    $("fuente").textContent = d.fuente;
    $("n-cache").classList.toggle("activo", d.fuente.includes("caché"));
    $("n-db").classList.toggle("activo", d.fuente.includes("base de datos"));
    document.title = d.nombre + " · Niveles de sueño";
  }

  async function cargar() {
    const r = await fetch("/api/estado");
    pintar(await r.json());
  }

  $("btn").addEventListener("click", async () => {
    $("btn").disabled = true;
    try {
      const r = await fetch("/api/descender", { method: "POST" });
      pintar(await r.json());
    } finally {
      $("btn").disabled = false;
    }
  });

  cargar();
  setInterval(cargar, 5000);   // cada 5 s re-pregunta: se ve el TTL de la caché en directo
</script>
</body>
</html>

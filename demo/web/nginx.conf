# nginx de la capa «web»: sirve la página y delega /api/ al servicio «api».
# Ojo al truco: «api» no es una IP, es el NOMBRE del servicio en la red de Compose.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }
}

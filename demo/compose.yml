# ============================================================
#  «Niveles de sueño» — 4 microservicios, un solo comando
#
#    web (nginx) ──> api (FastAPI) ──> cache (Redis)
#                            │                (si falla, baja a…)
#                            └────────> db (MySQL)
#
#  Arrancar:   docker compose up --build
#  Abrir:      http://localhost:8080
#  Parar:      docker compose down      (los datos sobreviven)
# ============================================================
name: niveles-de-sueno

services:
  web:
    build: ./web                 # sirve la web estática y hace proxy /api/ -> api
    ports:
      - "${WEB_PUERTO:-8080}:80" # el navegador solo ve este puerto
    depends_on:
      - api
    networks: [sueno]

  api:
    build: ./api                 # FastAPI: mira la caché; si no hay, baja a MySQL
    environment:
      DB_HOST: db                # ¡el nombre del servicio ES el host (DNS de Compose)!
      DB_USER: sueno
      DB_PASSWORD: ${DB_PASSWORD:-sueno_pass}
      DB_NAME: sueno
      REDIS_HOST: cache          # ídem: «cache» resuelve al contenedor de Redis
    depends_on:
      db:
        condition: service_healthy   # no arranca hasta que MySQL pasa su healthcheck
      cache:
        condition: service_healthy
    healthcheck:                     # ¿está viva la API? lo comprueba Compose
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/salud')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [sueno]

  cache:
    image: redis:7-alpine        # imagen oficial, sin Dockerfile propio
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    networks: [sueno]

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sueno
      MYSQL_USER: sueno
      MYSQL_PASSWORD: ${DB_PASSWORD:-sueno_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    volumes:
      - datos:/var/lib/mysql     # named volume -> los datos persisten entre arranques
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # seed solo el PRIMER arranque
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sueno", "-psueno_pass"]
      interval: 5s
      retries: 10
      start_period: 30s          # MySQL tarda en arrancar: dale margen
    networks: [sueno]

volumes:
  datos:      # sobrevive a «down»; se borra con «down -v»

networks:
  sueno:      # red privada del proyecto: los servicios se ven por nombre, fuera no entra nadie
